name: Offline installer checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Offline archive, mock ADB and transaction tests
        run: python -m unittest discover -s tests -v
      - name: Read-only manifest plan
        run: python manage_modpack.py plan --profile recommended
      - name: Linux builder integrity tests
        if: runner.os == 'Linux'
        run: python -m unittest discover -s builder -p test_builder.py -v
      - name: Windows PowerShell 5 wrapper plan
        if: runner.os == 'Windows'
        shell: powershell
        run: .\Manage-Modpack.ps1 -Command plan -Profile recommended
